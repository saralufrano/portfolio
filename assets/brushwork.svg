    <feComponentTransfer><feFuncR type="linear" slope=".35" intercept=".65"/><feFuncG type="linear" slope=".35" intercept=".65"/><feFuncB type="linear" slope=".35" intercept=".65"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
</defs>
